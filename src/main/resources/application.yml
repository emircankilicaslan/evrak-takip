spring:
  application:
    name: evrak-takip
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${DB_USER:evrak}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  autoconfigure:
    # LDAP yalnızca "ldap" kipinde ve doğrudan Active Directory sağlayıcısıyla kullanılır;
    # Spring Boot'un varsayılan LDAP bağlantısı (localhost:389) kurulmasın.
    exclude: org.springframework.boot.autoconfigure.ldap.LdapAutoConfiguration

springdoc:
  swagger-ui:
    path: /swagger
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    ldap:
      enabled: false

evrak:
  kimlik:
    mod: ${KIMLIK_MODU:yerel}          # yerel | ldap
    ad-domain: ${AD_DOMAIN:}           # ör. kurum.gov.tr
    ldap-url: ${LDAP_URL:}             # ör. ldaps://dc.kurum.gov.tr:636
  jwt:
    gizli-anahtar: ${JWT_SECRET:}      # en az 32 bayt, ortam değişkeninden verilir
    gecerlilik-dakika: 60
  guvenlik:
    kilit-esigi: 5               # art arda bu kadar hatalı girişte hesap geçici kilitlenir
    kilit-dakika: 15
    sifre-min-uzunluk: 10
  hiz-siniri:
    etkin: true
    giris-dakika: 10             # istemci (IP) başına dakikada giriş denemesi
    yazma-dakika: 120            # POST/PUT/PATCH/DELETE
    okuma-dakika: 600            # GET/HEAD/OPTIONS
    guvenilir-vekil: false       # true: istemci adresi X-Forwarded-For başlığındaki son girdidir (yalnızca güvenilir ters vekil arkasında açın)
  # Aşağıdaki süre değerleri ÖRNEKTİR. Kurum, kendi mevzuat yorumuna göre değiştirmelidir;
  # koda gömülü kural yoktur.
  kurallar:
    acele-cevap-is-gunu: 3             # ACELE evrakta cevap süresi (iş günü)
    bilgi-edinme-cevap-is-gunu: 15     # başvurudan itibaren cevap süresi (iş günü)
    bilgi-edinme-uzatma-is-gunu: 15    # gerekçeli tek seferlik uzatma (iş günü)
    bilgi-edinme-yonlendirme-gun: 7    # yetkisiz kuruma yapılan başvuruyu yönlendirme süresi (takvim günü)
    bilgi-edinme-itiraz-gun: 15        # cevap/ret tarihinden itiraz süresi (takvim günü)
