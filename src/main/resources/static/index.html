<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Evrak Takip</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <aside class="yan" id="yan" hidden>
    <div class="marka">
      <span class="marka-isaret" aria-hidden="true"></span>
      <span>Evrak Takip<small>Evrak ve başvuru yönetimi</small></span>
    </div>
    <nav id="menu" aria-label="Ana menü"></nav>
    <div id="kullanici" class="kullanici">
      <div class="kisi"><span class="avatar" id="avatar"></span><span id="kullanici-bilgi"></span></div>
      <button type="button" id="sifre-degistir" class="ikincil">Parola</button>
      <button type="button" id="cikis" class="ikincil">Çıkış</button>
    </div>
  </aside>

  <main id="icerik" tabindex="-1"></main>
  <div id="bildirim" role="status" aria-live="polite" class="bildirim" hidden></div>

  <dialog id="iletisim">
    <form method="dialog" id="iletisim-form">
      <h2 id="iletisim-baslik"></h2>
      <div id="iletisim-alanlar"></div>
      <menu>
        <button type="button" id="iletisim-iptal" class="ikincil">Vazgeç</button>
        <button type="submit" id="iletisim-tamam">Tamam</button>
      </menu>
    </form>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
